[package]
name = "mtlsctl"
version = "0.1.0"
description = "Short lived Client Certificate generation client"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
lazy_static = "1.5.0"
chrono = "0.4.38"
clap = { version = "4.0", features = ["derive"] }
configparser = "3.1.0"
dirs = "6.0.0"
gpgme = "0.11.0"
hostname = "0.4.0"
nss = "0.7.1"
pem = "3.0.5"
rcgen = { version = "0.13.2", features = ["x509-parser"] }
serde = "1.0.218"
which = "7.0.2"
xdg = "2.5.2"
